name: Publicar Normando para Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Conferir versão da tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) {
            throw "A tag v$tag não corresponde à versão $version do package.json."
          }

      - name: Instalar dependências
        run: npm ci

      # o typst.exe (38 MB) não fica no git; ver build/typst/LEIA-ME.txt
      - name: Baixar o Typst (compositor dos PDFs)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "typst.zip"
          $dir = Join-Path $env:RUNNER_TEMP "typst"
          Invoke-WebRequest -Uri "https://github.com/typst/typst/releases/download/v0.14.0/typst-x86_64-pc-windows-msvc.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter typst.exe | Select-Object -First 1
          if (-not $exe) { throw "typst.exe não encontrado no zip." }
          Copy-Item $exe.FullName "build/typst/typst.exe" -Force
          & "build/typst/typst.exe" --version

      - name: Preparar conexão padrão com o Railway
        shell: pwsh
        env:
          NORMANDO_RAILWAY_URL: ${{ vars.NORMANDO_RAILWAY_URL || 'https://legislator-production.up.railway.app' }}
          NORMANDO_RAILWAY_API_KEY: ${{ secrets.NORMANDO_RAILWAY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NORMANDO_RAILWAY_URL)) {
            throw "Configure a variável NORMANDO_RAILWAY_URL no repositório."
          }
          if ([string]::IsNullOrWhiteSpace($env:NORMANDO_RAILWAY_API_KEY)) {
            throw "Configure o secret NORMANDO_RAILWAY_API_KEY no repositório."
          }
          $config = @{
            url = $env:NORMANDO_RAILWAY_URL
            chave = $env:NORMANDO_RAILWAY_API_KEY
            modo = "railway"
          } | ConvertTo-Json
          [IO.File]::WriteAllText(
            (Join-Path $PWD "build/railway-default.json"),
            $config,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Gerar instalador e publicar Release
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
