appId: br.gov.normando.comparadorxml
productName: Comparador XML Normando
copyright: Copyright © 2026

directories:
  buildResources: build
  output: dist-comparador-publicacao

files:
  - out-comparador/**/*

extraMetadata:
  main: out-comparador/main/index.js

win:
  target: nsis
  icon: build/icon.png
  artifactName: Comparador-XML-Normando-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages: [pt_BR]
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Comparador XML Normando
